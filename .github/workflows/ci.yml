name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # The PDF writer is hand-rolled, so its output is checked by a parser nobody
      # here wrote. Not preinstalled on the runner, so install it rather than skip
      # the only assertion that does not trust our own reading of the format.
      - name: Install Ghostscript
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ghostscript
          gs --version

      - name: Test
        run: pnpm run test:coverage
