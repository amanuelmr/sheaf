name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # The PDF writer and the JPEG decoder are both hand-rolled, so each is checked
      # against an implementation nobody here wrote: Ghostscript parses our PDFs, and
      # libjpeg decodes the same photographs we do. Neither is preinstalled, so
      # install them rather than skip the only assertions that do not trust our own
      # reading of the formats.
      - name: Install Ghostscript and libjpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ghostscript libjpeg-turbo-progs
          gs --version
          djpeg -version

      - name: Test
        run: pnpm run test:coverage

      # Ten thousand documents take about ten seconds to index, which is too slow for
      # every local test run but cheap enough to hold the bound on every push.
      - name: Search benchmark
        run: pnpm run bench:search

      # The OCR sidecar is Python, tested against a stand-in ocrmypdf so neither
      # Docker nor Tesseract is needed here.
      # Tests import packages through aliases, so they pass even when the server's own
      # package.json forgets a dependency. Starting it the way a developer would is the
      # only check that catches that; it once went unnoticed for a whole step.
      - name: Start the server outside Docker
        run: |
          export SHEAF_TOKEN=ci-check-0123456789abcdef SHEAF_DATA_DIR=$(mktemp -d) PORT=8799
          node --experimental-strip-types services/ingest/src/main.ts > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -H "authorization: Bearer $SHEAF_TOKEN" localhost:8799/v1/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: OCR sidecar tests
        run: python3 -m unittest discover services/ocr/test

      # Extraction accuracy is a number, and a change that lowers it fails the build
      # (ADR 0010). Models answer from recordings, so no API key is needed here.
      - name: Extraction eval
        run: |
          pnpm --filter @sheaf/extract eval:fetch
          pnpm --filter @sheaf/extract eval -- --replay --check

      # The app cannot be run here, so bundle it instead. Metro resolving every
      # workspace import and every screen is a far stronger signal than typecheck
      # alone -- and it is how the missing @expo/metro-runtime peer was found.
      - name: Bundle the app
        run: pnpm run bundle

      # Same reasoning as the mobile bundle above: a Vite production build resolves
      # every import for real, which typecheck alone does not.
      - name: Build the admin dashboard
        run: pnpm run bundle:web
