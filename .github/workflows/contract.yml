name: Contract

# Checks our beliefs about Paperless-ngx against a real one. Weekly rather than per
# push: it needs Docker and real wall-clock time, and what it catches is Paperless
# changing, which happens on Paperless's schedule rather than ours.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  contract:
    name: Paperless-ngx ${{ matrix.paperless }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paperless: [pinned, latest]
    # The pinned version must pass. `latest` failing is news about Paperless, not a
    # broken build: it is the signal to look before moving the pin.
    continue-on-error: ${{ matrix.paperless == 'latest' }}
    # The suite is bounded (readiness, token, then 120 s per test), but the image is
    # 3.4 GB and a slow link has no upper limit. GitHub's default is six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Contract tests against a disposable Paperless-ngx
        run: pnpm run test:contract
        env:
          PAPERLESS_IMAGE: ${{ matrix.paperless == 'latest' && 'ghcr.io/paperless-ngx/paperless-ngx:latest' || '' }}

      # `continue-on-error` means a broken `latest` still renders this run green, so
      # it has to announce itself somewhere a person will actually see.
      - name: Report the result
        if: always()
        run: |
          if [ "${{ matrix.paperless }}" = "latest" ] && [ "${{ job.status }}" != "success" ]; then
            echo "### Paperless-ngx \`latest\` failed the contract suite" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "The pinned version still passes; this is Paperless changing under us." >> "$GITHUB_STEP_SUMMARY"
            echo "Look at what moved, then move the pin deliberately." >> "$GITHUB_STEP_SUMMARY"
          fi
