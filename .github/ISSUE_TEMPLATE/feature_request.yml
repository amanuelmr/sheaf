name: Feature request
description: Suggest something Sheaf should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Capture and reliable delivery are Sheaf's centre of gravity; search, filing
        and the web app exist to make what was delivered worth keeping. Requests
        that reduce friction between a piece of paper and a findable document are
        the ones most likely to land.
  - type: textarea
    id: problem
    attributes:
      label: What is slow, awkward, or unreliable today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: How does this reduce friction between a physical document and finding it later
    validations:
      required: true
