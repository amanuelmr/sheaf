# The Sheaf server. Yours: it runs on your machine and holds your documents.
#
#   echo "SHEAF_TOKEN=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")" > .env
#   docker compose up -d
#
# That is a complete server on its own (ADR 0007): the phone delivers to it, and it
# keeps every document. To also hand documents on to Paperless-ngx, add its file:
#
#   docker compose -f compose.yml -f compose.paperless.yml up -d
#
# For local development you do not need this at all -- the server has no runtime
# dependencies, so `pnpm --filter @sheaf/ingest start` is faster and equivalent.
services:
  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    restart: unless-stopped
    ports:
      - '8787:8787'
    environment:
      # No default. A server holding documents should not come up guessable.
      SHEAF_TOKEN: ${SHEAF_TOKEN:?set SHEAF_TOKEN to a long random string}
      # Optional: free a document's bytes this many days after the named connector
      # confirms it. Unset keeps every copy forever, which is the conservative
      # default. Setting the days without the connector stops the server starting.
      SHEAF_RETENTION_DAYS: ${SHEAF_RETENTION_DAYS:-}
      SHEAF_RETENTION_CONNECTOR: ${SHEAF_RETENTION_CONNECTOR:-}
    volumes:
      - documents:/data

volumes:
  documents:
