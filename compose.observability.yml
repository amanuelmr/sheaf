# Adds Prometheus and Grafana, with a dashboard for the Sheaf server already in place.
#
#   docker compose -f compose.yml -f compose.observability.yml up -d
#   open http://localhost:3000
#
# Prometheus reads /metrics with the admin token, handed over as a secret rather than
# written into its configuration. Both listen on this machine only.
services:
  ingest:
    environment:
      SHEAF_LOG_FORMAT: json

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    secrets:
      - sheaf_token
    ports:
      - '127.0.0.1:9090:9090'

  grafana:
    image: grafana/grafana:12.4.12
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sheaf.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - '127.0.0.1:3000:3000'

secrets:
  sheaf_token:
    environment: SHEAF_TOKEN

volumes:
  prometheus:
  grafana:
