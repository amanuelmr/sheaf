# A Paperless-ngx you run yourself, for developing and testing Sheaf against.
#
# This is not a service anyone else operates: it is the same software a Sheaf user
# runs on their own NAS, Raspberry Pi or VPS, started here on your machine. Sheaf
# talks to it and to nothing else — that is the entire privacy model.
#
#   docker compose -f docker/compose.paperless.yml up -d
#   open http://localhost:8000        # admin / admin
#
# SQLite and a throwaway admin password: this is a test instance, not a home for
# real documents.
services:
  broker:
    image: docker.io/library/redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - broker
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD', 'curl', '-fs', '-S', '--max-time', '2', 'http://localhost:8000']
      interval: 10s
      timeout: 5s
      retries: 30
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_URL: http://localhost:8000
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: admin
      PAPERLESS_TIME_ZONE: UTC
      PAPERLESS_OCR_LANGUAGE: eng
      # Keeps first start quick; Sheaf does not depend on OCR either way.
      PAPERLESS_TASK_WORKERS: '1'
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media

volumes:
  data:
  media:
  redisdata:
